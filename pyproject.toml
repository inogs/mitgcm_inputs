[project]
name = "mitgcm-inputs"
version = "0.1.0"
description = ""
authors = [
    { name = "Giorgio Bolzon", email = "gbolzon@ogs.it" },
    { name = "Stefano Piani", email = "spiani@ogs.it" }
]
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "numpy>=2.1.3,<3.0.0",
    "scipy>=1.15.2,<2.0.0",
    "bitsea @ git+https://github.com/inogs/bit.sea.git@master",
    "xarray>2026.1.0",
    "pandas[openpyxl]>=3.0.0,<4.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "copernicusmarine>=2.3.0,<3.0.0",
    "matplotlib>=3.10.8,<4.0.0",
    "dask>=2026.1.2",
    "ogs-riverger @ git+https://github.com/inogs/ogs_riverger.git",
    "numba>=0.64.0",
    "pystac>=1.14.0,<1.15.0"
]

[project.scripts]
mitgcm_inputs = "mitgcm_inputs.__main__:main"

[tool.poetry]
packages = [{include = "mitgcm_inputs", from = "src"}]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.0"
deptry = ">0.21.2"
pandas-stubs = "^2.2.3"

[tool.deptry]
exclude = ["legacy_code/"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "matplotlib",
    "numba",
    "openpyxl",
    "pystac",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
